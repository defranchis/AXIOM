sensorName: 'N4791_3' # this is the right name, but we ran with 200333_B
irradiationSteps: [0, 0.5, 1, 2, 3,4, 5, 7, 10, 15, 20, 30, 50]
#dose_rate: 12.79

devices:
  source-meter:
    model: 'ke2410'  
    address: 25
    open_short_correction: false
    correction_count: 5
    range:
      v_min: -20
      v_max: -800
      step: -10
      nSampling: 10
    delay: 5                        # delay between setting voltage and executing measurement in [s]
    lim_cur: 1.0e-4                 # compliance in [A]
    #lim_vol = 10                   # compliance in [V]
  switch:
    model: 'ke7001'
    address: 7
  lcr-meter:
    model: 'agilent_4263b'
    address: 17                    # in the SSD lab this is 9
    voltage: 0.5                   # ac voltage amplitude in [mV]
    #self.cv_res = 1e6                   # cv parallel resistor in [Ohm]
    frequency: 1000                # ac frequency in [Hz]
    mode: 'RX'
    approx_open_corr: 50.0e-12