devices:
  sourcemeter_1:
    model: 'ke2410'  
    address: 8
    open_short_correction: false
    correction_count: 5
    lim_cur: 1.0e-3

  sourcemeter_2:
    model: 'ke2410'  
    address: 25
    lim_cur: 1.0e-3
    
  switch:
    model: 'ke7001'
    address: 7
    connections:
      lcrmeter: 1
      picoammeter: 3

  lcrmeter:
    model: 'agilent_4263b'
    address: 17

  picoammeter:
    model: 'ke6487'
    address: 15

measurements:
  CV:
    range:
      v_min: -100   #  -50 if '120um' in self.id else -100
      v_max: -900   #   400 if '120um' in self.id else (-600 if '200um' in self.id else -900)
      step_size: -50
    sample_size: 10
    lcr_amplitude: 0.5
    frequencies: [100, 1000, 10000]  # needs to be integers otherwise the utils complain
    delay: 10
  IV:
    measurement_range:
      v_min: -0.5
      v_max: 0.5
      step_size: 0.1
    bias_range:
      v_min: -10 
      v_max: -800
      step_size: -10
    sample_size: 30
    delay: 10 
    step_delay: 3
