sample:
  preirradiated: true
  current_dose: 3


devices:
  sourcemeter_1:
    model: 'ke2410'  
    address: 8
    open_short_correction: false
    correction_count: 5
    lim_cur: 1.0e-3 # compliance current in [A]

  sourcemeter_2:
    model: 'ke2410'  
    address: 25
    lim_cur: 1.0e-3 # compliance current in [A]
    
  switch:
    model: 'ke7001'
    address: 7
    # connections:
    #   lcrmeter: 1
    #   picoammeter: 3

  lcrmeter:
    model: 'agilent_4263b'
    address: 17

  picoammeter:
    model: 'ke6487'
    address: 15
    lim_cur: 100.0e-9    # compliance in [A] for the GCD, this should be 10 nA


measurements:
  CV:
    range:
      v_min: 0.   #  -50 if '120um' in self.id else -100
      v_max: -90   #   -400 if '120um' in self.id else (-600 if '200um' in self.id else -900)
      step_size: -3
    sample_size: 5
    lcr_amplitude: 0.250 # 0.501 # ac voltage amplitude in [mV]
    lcr_frequency: 10000  # ac voltage frequency in [Hz]
    delay: 0.3 # delay in [s] between setting the voltage and executing the measurement

  IV:
    range:
      v_min: 10
      v_max: -100
      step_size: -3
    sample_size: 30
    gcd_diode_bias: 10.0  # [V] bias voltage applied to the GCD diode
    delay: 2.0 # delay in [s] between setting the voltage and executing the measurement