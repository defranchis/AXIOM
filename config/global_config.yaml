measurement_type: 'diodeCV'
sample:
  type: 'diode' #TODO: this can always be inferred from which type of measurement is specified (except diode as strip i guess?)
  id: 100408_A  #TODO:: this should always be requested from the cli
  preexisting_dose: 0        # this is only used if no dose is provided by the runner (so just running msr without irradiation)

  
devices:
  sourcemeter_1:
    model: 'ke2410'  
    address: 8
    lim_cur: 1.0e-3                 # compliance in [A]

  switch:
    model: 'ke7001'
    address: 7

  lcrmeter:
    model: 'agilent_4263b'
    address: 17                     # in the SSD lab this is 9
    mode: 'RX'
    approx_open_corr: 50.0e-12


measurements:
  testset: [floating, short, ground]  #[floating, short, ground]

  CV:
    range:
      v_start: -0
      v_end: -800
      step_size: -25
    sample_size: 10
    delay: 5                        # delay between setting voltage and executing measurement in [s]
    trig_delay: 0.1                   # delay between individual lcr triggers  
    lcr_amplitude: 0.5                    # ac voltage amplitude in [mV]
    lcr_frequency: 1000                 # ac frequency in [Hz]

