measurement_type: 'gcdmos'
sample:
  type: 'gcdmos'              # TODO: this can always be inferred from which type of measurement is specified (except when executing diode as strip i guess?)
  id: 102179                  # TODO: this should always be requested from the cli
  preexisting_dose: 100


devices:
  sourcemeter_1:
    model: 'ke2410'  
    address: 8
    lim_cur: 1.0e-3 # compliance current in [A]

  sourcemeter_2:
    model: 'ke2410'  
    address: 25
    lim_cur: 1.0e-3 # compliance current in [A]
    
  switch:           #if the switch is specified, it will try to initialize and use it. if directly connecting to devices, comment switch out.
    model: 'ke7001'
    address: 7
    connections:
      MOShalf: 1
      MOS2000: 3
      picoammeter: 9 # (?)

  lcrmeter:
    model: 'agilent_4263b'
    address: 17

  picoammeter:
    model: 'ke6487'
    address: 15
    lim_cur: 100.0e-9    # compliance in [A] for the GCD, this should be 10 nA

  multimeter:
    model: 'ke2001'
    address: 16
    sensor_r0: 1000

measurements: 
  testset: [moshalf, mos2000, gcd]    #determines which measurements are exectued
  dynamic_voltage_range:
    enabled: true
    voltage_array_size: 35
    range_multiplier: 1

  CV:
    range:
      v_start: 0.   # 
      v_end: -200   #   
      step_size: -10
    sample_size: 10
    lcr_amplitude: 0.250 # 0.501 # ac voltage amplitude in [mV]
    lcr_frequency: 10000  # ac voltage frequency in [Hz]
    delay: 5  # delay in [s] between setting the voltage and executing the measurement
    trig_delay: 0.1

  IV:
    range:
      v_start: 10
      v_end: -10
      step_size: -1
    sample_size: 10
    gcd_diode_bias: 5.0  # [V] bias voltage applied to the GCD diode
    delay: 2.0 # delay in [s] between setting the voltage and executing the measurement

